name: build-installer

# Builds the Windows installer. Runs on every push of a version tag (v1.2.3)
# and attaches Murmur-Setup.exe to the GitHub Release. Also runnable
# manually from the Actions tab (produces an artifact, no release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python make_icon.py

      - name: Build app (PyInstaller)
        run: pyinstaller Murmur.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-Setup
          path: Output/Murmur-Setup.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Murmur-Setup.exe
          generate_release_notes: true
